name: Build Add-on and AppImage

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Compilazione Immagini Docker Multi-Arch per Home Assistant (GHCR)
  # ============================================================================
  build-addon:
    name: Build Add-on (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          VERSION=$(grep '^version:' local-drop-share/config.yaml | cut -d '"' -f 2)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "OWNER=${OWNER}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION} for owner: ${OWNER}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./local-drop-share
          file: ./local-drop-share/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.OWNER }}/local_drop_share_${{ matrix.arch }}:${{ steps.meta.outputs.VERSION }}
            ghcr.io/${{ steps.meta.outputs.OWNER }}/local_drop_share_${{ matrix.arch }}:latest
          labels: |
            io.hass.version=${{ steps.meta.outputs.VERSION }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
            io.hass.name=Local Drop & Share

  # ============================================================================
  # 2. Compilazione AppImage Standalone Linux (x86_64)
  # ============================================================================
  build-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file wget curl libegl1 libgl1

      - name: Build AppImage
        run: |
          chmod +x build_appimage.sh
          ./build_appimage.sh

      - name: Generate Checksum
        run: |
          sha256sum Local_Drop_Share-x86_64.AppImage > Local_Drop_Share-x86_64.AppImage.sha256

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Local_Drop_Share-x86_64-AppImage
          path: |
            Local_Drop_Share-x86_64.AppImage
            Local_Drop_Share-x86_64.AppImage.sha256

  # ============================================================================
  # 3. Creazione Release GitHub (se scatenato da un tag git, es. v1.1.0)
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-addon, build-appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: Local_Drop_Share-x86_64-AppImage
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
