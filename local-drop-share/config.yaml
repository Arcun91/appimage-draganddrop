name: "Local Drop & Share"
slug: "local_drop_share"
version: "1.1.0"
description: "Condividi file e cartelle all'istante sulla LAN tramite QR code e server temporaneo a bassissimo consumo di risorse."
url: "https://github.com/Arcun91/local-drop-share"
image: "ghcr.io/arcun91/local_drop_share_{arch}"
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:qrcode-scan"
panel_title: "Drop & Share"
homeassistant_api: true
map:
  - share:rw
  - media:rw
ports:
  5001/tcp: 5001
ports_description:
  5001/tcp: "Porta Web UI completa & Download accessibile da smartphone e PC sulla rete locale"
options:
  lan_port: 5001
  lan_ip_override: ""
  auto_clean_hours: 24
schema:
  lan_port: "port"
  lan_ip_override: "str?"
  auto_clean_hours: "int"
